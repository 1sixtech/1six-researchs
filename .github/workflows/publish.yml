name: Publish articles

# The 1six.tech build downloads its articles from this repository, so a change
# to an article folder needs a new build. A Vercel Deploy Hook starts one.
on:
  push:
    branches: [main]
    paths:
      - '[0-9][0-9][0-9]-*/**'
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger the website deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail-with-body --silent --show-error --max-time 30 --retry 3 --retry-all-errors --request POST "$DEPLOY_HOOK_URL"
