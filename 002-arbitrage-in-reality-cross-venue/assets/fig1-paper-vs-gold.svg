<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">The trade on paper vs the gold trade</title><desc id="d">Paper arbitrage assumes one asset and a fast return leg; the Hyperliquid to Lighter gold route needs a token redemption on Ethereum taking about 12 hours.</desc><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#52514e;font-size:14px}
.t{fill:#0b0b0b;font-size:17px;font-weight:700}.l{fill:#0b0b0b}.b{font-weight:700}.w{fill:#ffffff;font-weight:700}.s{font-size:12px}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
@media (prefers-color-scheme: dark){
text{fill:#c3c2b7}.t,.l{fill:#f0efec}.w{fill:#ffffff}.grid{stroke:#2c2c2a}.axis{stroke:#383835}
[fill="#fcfcfb"]{fill:#1a1a19}[stroke="#fcfcfb"]{stroke:#1a1a19}[fill="#f1f0ec"]{fill:#262624}
[fill="#2a78d6"]{fill:#3987e5}[stroke="#2a78d6"]{stroke:#3987e5}[fill="#9ec5f4"]{fill:#184f95}
[fill="#eb6834"]{fill:#d95926}[stroke="#eb6834"]{stroke:#d95926}[fill="#f6c2a8"]{fill:#7a3416}
[stroke="#0b0b0b"]{stroke:#f0efec}[stroke="#52514e"]{stroke:#c3c2b7}[fill="#52514e"]{fill:#c3c2b7}}
</style><rect width="760" height="330" fill="#fcfcfb"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<text class="t" x="16" y="30">The trade on paper and in practice</text>
<text class="l b" x="16" y="66">On paper</text>
<rect x="40" y="82" width="200" height="62" rx="8" fill="#f1f0ec" stroke="#c3c2b7"/><text class="l b" x="140.0" y="109.0" text-anchor="middle">Venue A</text><text class="s" x="140.0" y="128.0" text-anchor="middle">long at 100.0</text>
<rect x="520" y="82" width="200" height="62" rx="8" fill="#f1f0ec" stroke="#c3c2b7"/><text class="l b" x="620.0" y="109.0" text-anchor="middle">Venue B</text><text class="s" x="620.0" y="128.0" text-anchor="middle">short at 100.5</text>
<line x1="242" y1="104" x2="518" y2="104" stroke="#52514e" stroke-width="2" marker-end="url(#ah)"/>
<text x="380" y="96" text-anchor="middle">both legs at once</text>
<line x1="518" y1="128" x2="242" y2="128" stroke="#52514e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="380" y="146" text-anchor="middle">rebalance: assumed instant</text>
<line class="grid" x1="16" y1="172" x2="744" y2="172"/>
<text class="l b" x="16" y="202">In practice: gold</text>
<rect x="16" y="220" width="210" height="68" rx="8" fill="#f1f0ec" stroke="#2a78d6"/><text class="l b" x="121.0" y="250.0" text-anchor="middle">Hyperliquid</text><text class="s" x="121.0" y="269.0" text-anchor="middle">holds XAUT0</text>
<rect x="275" y="220" width="210" height="68" rx="8" fill="#f1f0ec" stroke="#eb6834"/><text class="l b" x="380.0" y="250.0" text-anchor="middle">Ethereum lockbox</text><text class="s" x="380.0" y="269.0" text-anchor="middle">redeem to XAUT</text>
<rect x="534" y="220" width="210" height="68" rx="8" fill="#f1f0ec" stroke="#2a78d6"/><text class="l b" x="639.0" y="250.0" text-anchor="middle">Lighter spot</text><text class="s" x="639.0" y="269.0" text-anchor="middle">XAUT only</text>
<line x1="228" y1="254" x2="273" y2="254" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)"/>
<line x1="487" y1="254" x2="532" y2="254" stroke="#eb6834" stroke-width="2" marker-end="url(#ah)"/>
<text class="l" x="380" y="316" text-anchor="middle">About 12 hours end to end (reported, not verified)</text>

</svg>
