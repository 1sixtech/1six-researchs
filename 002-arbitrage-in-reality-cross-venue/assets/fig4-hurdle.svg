<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Minimum gap to clear</title><desc id="d">Round-trip fees of 7 bps maker or 19 bps taker plus measured leg-in of 5.0 bps median or 10.5 bps p90 give a hurdle of 12 to 29.5 bps.</desc><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#52514e;font-size:14px}
.t{fill:#0b0b0b;font-size:17px;font-weight:700}.l{fill:#0b0b0b}.b{font-weight:700}.w{fill:#ffffff;font-weight:700}.s{font-size:12px}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}
@media (prefers-color-scheme: dark){
text{fill:#c3c2b7}.t,.l{fill:#f0efec}.w{fill:#ffffff}.grid{stroke:#2c2c2a}.axis{stroke:#383835}
[fill="#fcfcfb"]{fill:#1a1a19}[stroke="#fcfcfb"]{stroke:#1a1a19}[fill="#f1f0ec"]{fill:#262624}
[fill="#2a78d6"]{fill:#3987e5}[stroke="#2a78d6"]{stroke:#3987e5}[fill="#9ec5f4"]{fill:#184f95}
[fill="#eb6834"]{fill:#d95926}[stroke="#eb6834"]{stroke:#d95926}[fill="#f6c2a8"]{fill:#7a3416}
[stroke="#0b0b0b"]{stroke:#f0efec}[stroke="#52514e"]{stroke:#c3c2b7}[fill="#52514e"]{fill:#c3c2b7}}
</style><rect width="760" height="360" fill="#fcfcfb"/>
<text class="t" x="16" y="30">The minimum gap a cross-venue trade must clear, in bps</text>
<rect x="16" y="51" width="14" height="14" rx="3" fill="#2a78d6"/><text x="36" y="63">Fees, round trip, both legs</text><rect x="246" y="51" width="14" height="14" rx="3" fill="#eb6834"/><text x="266" y="63">Leg-in: price moves between the two fills</text>
<line class="grid" x1="56" y1="300.0" x2="744" y2="300.0"/><text x="48" y="305.0" text-anchor="end">0</text>
<line class="grid" x1="56" y1="230.0" x2="744" y2="230.0"/><text x="48" y="235.0" text-anchor="end">10</text>
<line class="grid" x1="56" y1="160.0" x2="744" y2="160.0"/><text x="48" y="165.0" text-anchor="end">20</text>
<line class="grid" x1="56" y1="90.0" x2="744" y2="90.0"/><text x="48" y="95.0" text-anchor="end">30</text>
<rect x="150" y="251.0" width="80" height="49.0" fill="#2a78d6"/><rect x="150" y="216.0" width="80" height="35.0" fill="#eb6834"/><text class="w" x="190" y="280.5" text-anchor="middle">7</text><text class="l b" x="190" y="208.0" text-anchor="middle">12</text><text x="190" y="320" text-anchor="middle">all maker</text>
<rect x="270" y="167.0" width="80" height="133.0" fill="#2a78d6"/><rect x="270" y="132.0" width="80" height="35.0" fill="#eb6834"/><text class="w" x="310" y="238.5" text-anchor="middle">19</text><text class="l b" x="310" y="124.0" text-anchor="middle">24</text><text x="310" y="320" text-anchor="middle">all taker</text>
<text class="l b" x="250" y="344" text-anchor="middle">Median leg-in (5.0 bps)</text>
<rect x="500" y="251.0" width="80" height="49.0" fill="#2a78d6"/><rect x="500" y="177.5" width="80" height="73.5" fill="#eb6834"/><text class="w" x="540" y="280.5" text-anchor="middle">7</text><text class="l b" x="540" y="169.5" text-anchor="middle">17.5</text><text x="540" y="320" text-anchor="middle">all maker</text>
<rect x="620" y="167.0" width="80" height="133.0" fill="#2a78d6"/><rect x="620" y="93.5" width="80" height="73.5" fill="#eb6834"/><text class="w" x="660" y="238.5" text-anchor="middle">19</text><text class="l b" x="660" y="85.5" text-anchor="middle">29.5</text><text x="660" y="320" text-anchor="middle">all taker</text>
<text class="l b" x="600" y="344" text-anchor="middle">p90 leg-in (10.5 bps)</text>
</svg>
