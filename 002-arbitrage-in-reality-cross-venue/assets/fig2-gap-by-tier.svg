<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="t d"><title id="t">Residual gap vs Binance by venue group and asset tier</title><desc id="d">90th percentile of the minute-by-minute residual gap to Binance, after removing each pair's steady offset. Only small caps on large DEXs cross the 24 bps taker hurdle.</desc><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#52514e;font-size:14px}
.t{fill:#0b0b0b;font-size:17px;font-weight:700}.l{fill:#0b0b0b}.b{font-weight:700}.w{fill:#ffffff;font-weight:700}.s{font-size:12px}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}.hur{stroke:#52514e;stroke-width:1.5;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
text{fill:#c3c2b7}.t,.l{fill:#f0efec}.w{fill:#ffffff}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.hur{stroke:#c3c2b7}
[fill="#fcfcfb"]{fill:#1a1a19}[fill="#2a78d6"]{fill:#3987e5}[fill="#9ec5f4"]{fill:#184f95}
[fill="#eb6834"]{fill:#d95926}[fill="#f6c2a8"]{fill:#7a3416}[fill="#c3c2b7"]{fill:#5a5955}}
</style><rect width="760" height="400" fill="#fcfcfb"/>
