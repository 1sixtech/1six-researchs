<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" role="img" aria-labelledby="t d"><title id="t">Residual gap vs Binance by venue group and asset tier</title><desc id="d">90th percentile of the 15-minute residual gap to Binance over 50 days, with the value on the 12 most volatile days marked. Small caps on DEXs cross the 24 bps taker breakeven; majors stay below the 12 bps maker breakeven everywhere.</desc><style>
