<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="t d"><title id="t">Lead–lag against Binance</title><desc id="d">Almost every DEX price moves after Binance, usually within a minute; Bybit and OKX move with Binance rather than after it.</desc><style>
text{font-family:Helvetica,Arial,sans-serif;fill:#52514e;font-size:14px}
.t{fill:#0b0b0b;font-size:17px;font-weight:700}.l{fill:#0b0b0b}.b{font-weight:700}.w{fill:#ffffff;font-weight:700}.s{font-size:12px}
.grid{stroke:#e1e0d9;stroke-width:1}.axis{stroke:#c3c2b7;stroke-width:1}.hur{stroke:#52514e;stroke-width:1.5;stroke-dasharray:6 4}
@media (prefers-color-scheme: dark){
text{fill:#c3c2b7}.t,.l{fill:#f0efec}.w{fill:#ffffff}.grid{stroke:#2c2c2a}.axis{stroke:#383835}.hur{stroke:#c3c2b7}
[fill="#fcfcfb"]{fill:#1a1a19}[fill="#2a78d6"]{fill:#3987e5}[fill="#9ec5f4"]{fill:#184f95}
[fill="#eb6834"]{fill:#d95926}[fill="#f6c2a8"]{fill:#7a3416}[fill="#c3c2b7"]{fill:#5a5955}}
</style><rect width="760" height="270" fill="#fcfcfb"/>
<text class="t" x="16" y="30">Pairs that move after Binance</text>
<line class="grid" x1="300.0" y1="56" x2="300.0" y2="236"/><text class="s" x="300.0" y="254" text-anchor="middle">0%</text>
<line class="grid" x1="397.5" y1="56" x2="397.5" y2="236"/><text class="s" x="397.5" y="254" text-anchor="middle">25%</text>
<line class="grid" x1="495.0" y1="56" x2="495.0" y2="236"/><text class="s" x="495.0" y="254" text-anchor="middle">50%</text>
<line class="grid" x1="592.5" y1="56" x2="592.5" y2="236"/><text class="s" x="592.5" y="254" text-anchor="middle">75%</text>
<line class="grid" x1="690.0" y1="56" x2="690.0" y2="236"/><text class="s" x="690.0" y="254" text-anchor="middle">100%</text>
<text class="l" x="16" y="87">Big CEX</text><rect x="300" y="70" width="210.0" height="24" rx="4" fill="#2a78d6"/><text class="l b" x="518.0" y="87">54%</text><text class="s" x="16" y="108">21 of 39 pairs</text>
<text class="l" x="16" y="149">Large DEX</text><rect x="300" y="132" width="379.6" height="24" rx="4" fill="#2a78d6"/><text class="l b" x="687.6" y="149">97%</text><text class="s" x="16" y="170">73 of 75 pairs</text>
<text class="l" x="16" y="211">Small DEX</text><rect x="300" y="194" width="385.0" height="24" rx="4" fill="#2a78d6"/><text class="l b" x="693.0" y="211">99%</text><text class="s" x="16" y="232">77 of 78 pairs</text>

</svg>
